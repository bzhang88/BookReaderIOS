name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: ["master"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Show available SDKs
        run: xcodebuild -showsdks

      - name: Build unsigned app
        # MARKETING_VERSION/CURRENT_PROJECT_VERSION are overridden per-run (not the static
        # "0.1.0"/"1" baked into project.yml) so every build produces a distinct version string --
        # AltStore's update check compares this against what's already installed, so a version that
        # never changes would mean it never detects a new build as an update.
        run: |
          xcodebuild build \
            -project YueDu.xcodeproj \
            -scheme YueDu \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            MARKETING_VERSION="0.1.${{ github.run_number }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Package IPA
        run: |
          APP_PATH=$(find build/DerivedData -name "YueDu.app" -maxdepth 6 | head -n1)
          if [ -z "$APP_PATH" ]; then
            echo "Could not find YueDu.app in build output"
            find build/DerivedData -maxdepth 6 -name "*.app"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/
          cd build && zip -r YueDu-unsigned.ipa Payload

      - name: Validate IPA structure
        run: |
          rm -rf build/verify
          mkdir -p build/verify
          unzip -q build/YueDu-unsigned.ipa -d build/verify
          APP="build/verify/Payload/YueDu.app"
          test -d "$APP" || { echo "::error::Payload/YueDu.app missing from IPA"; exit 1; }
          test -f "$APP/Info.plist" || { echo "::error::Info.plist missing"; exit 1; }
          test -f "$APP/YueDu" || { echo "::error::YueDu executable missing"; exit 1; }
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          echo "Bundle ID: $BUNDLE_ID"
          test "$BUNDLE_ID" = "com.bzhang88.yuedu" || { echo "::error::unexpected bundle id $BUNDLE_ID"; exit 1; }
          echo "IPA structure OK"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: YueDu-unsigned-ipa
          path: build/YueDu-unsigned.ipa
          retention-days: 14

      - name: Generate AltStore source (apps.json)
        # AltStore polls a "source" URL for version metadata to offer in-app updates -- this has to
        # be a plain, permanently-stable, unauthenticated URL (unlike the Actions artifact above,
        # which expires in 14 days and needs a GitHub login to download), which is why this gets
        # published to a GitHub Release further down rather than as another workflow artifact.
        run: |
          VERSION="0.1.${{ github.run_number }}"
          BUILD="${{ github.run_number }}"
          SIZE=$(stat -f%z build/YueDu-unsigned.ipa)
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > apps.json << EOF
          {
            "name": "YueDu 更新源",
            "subtitle": "YueDu 自动构建更新源",
            "description": "YueDu 的 AltStore 更新源，每次推送到 master 分支后由 CI 自动更新，用来在 AltStore 里检测新版本。",
            "apps": [
              {
                "name": "YueDu",
                "bundleIdentifier": "com.bzhang88.yuedu",
                "developerName": "bzhang88",
                "subtitle": "书源阅读器",
                "localizedDescription": "从零开始写的书源阅读器，兼容 Legado 的书源规则格式。",
                "iconURL": "https://raw.githubusercontent.com/${{ github.repository }}/master/YueDuApp/AppIcon.png",
                "tintColor": "2962D6",
                "versions": [
                  {
                    "version": "$VERSION",
                    "buildVersion": "$BUILD",
                    "date": "$DATE",
                    "localizedDescription": "自动构建版本 #$BUILD",
                    "downloadURL": "https://github.com/${{ github.repository }}/releases/download/latest/YueDu-unsigned.ipa",
                    "size": $SIZE
                  }
                ]
              }
            ]
          }
          EOF
          cat apps.json

      - name: Publish IPA + source to a stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload latest build/YueDu-unsigned.ipa apps.json --clobber --repo "${{ github.repository }}"
          else
            gh release create latest build/YueDu-unsigned.ipa apps.json \
              --title "YueDu 最新构建（自动更新）" \
              --notes "每次推送到 master 都会自动覆盖更新。把下面这个地址加到 AltStore 的更新源里：https://github.com/${{ github.repository }}/releases/download/latest/apps.json" \
              --repo "${{ github.repository }}"
          fi
