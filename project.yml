name: YueDu
options:
  bundleIdPrefix: com.bzhang88.yuedu
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  BookSourceKit:
    path: Packages/BookSourceKit

targets:
  YueDu:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: YueDuApp/Sources
      - path: YueDuApp/Assets.xcassets
    info:
      path: YueDuApp/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: 拾光
        # xcodegen defaults these two keys to a hardcoded "1.0"/"1" when they're absent from this
        # properties block -- it does NOT automatically wire them to the MARKETING_VERSION/
        # CURRENT_PROJECT_VERSION build settings below just because those settings exist. Writing
        # the $(...) build-setting reference explicitly is what makes Xcode's "Process Info.plist"
        # build phase substitute in the real value at build time, honoring the CI's
        # per-run-number xcodebuild command-line override instead of silently ignoring it (this
        # was live-broken: real-device install failed with a version mismatch traced back to
        # CFBundleShortVersionString still reading Xcode's own literal "1.0" default).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Book sources are arbitrary user-supplied third-party sites, many of them plain HTTP with
        # no TLS at all (common for older/small Chinese novel sites) -- iOS blocks all cleartext
        # HTTP by default (App Transport Security), which isn't testable on Windows since ATS only
        # exists on Apple platforms. Without this, every plain-HTTP source fails outright before
        # our networking code even runs.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Lets read-aloud (AVSpeechSynthesizer) keep speaking and respond to lock-screen/Control
        # Center transport controls after the app backgrounds -- without this, TTS playback and
        # MPRemoteCommandCenter commands stop the moment the screen locks.
        UIBackgroundModes:
          - audio
        # Registers the "legado://" custom URL scheme so tapping a shared import link (or scanning
        # a QR code encoding one) opens straight into this app instead of just failing with "no app
        # found to open this link" -- matches Legado's own real-world import-link convention so
        # links/QR codes generated by Legado's desktop tools or other Legado-compatible apps work
        # here too, not just links this app generates itself.
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - legado
            CFBundleURLName: com.bzhang88.yuedu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bzhang88.yuedu
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: BookSourceKit
        product: BookSourceModel
      - package: BookSourceKit
        product: RuleEngine
      - package: BookSourceKit
        product: NetworkClient
      - package: BookSourceKit
        product: WebBookOrchestrator
      - package: BookSourceKit
        product: Persistence
      - package: BookSourceKit
        product: AIService
      - package: BookSourceKit
        product: LANWebServerCore
